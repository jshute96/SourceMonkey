<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VibeMonkey — Options</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
      h1 { margin-top: 0; }
      h2 { font-size: 1em; margin: 0; word-break: break-all; }
      button { font: inherit; padding: 0.3em 0.8em; cursor: pointer; }
      input[type="text"] { font: inherit; padding: 0.3em 0.5em; }
      .placeholder { color: #666; }
      .add-form { display: flex; gap: 0.5em; margin-bottom: 1em; align-items: center; }
      .add-form input[type="text"] { flex: 1 1 auto; }
      .directory { border: 1px solid #ddd; border-radius: 6px; padding: 0.8em 1em; margin-bottom: 0.8em; }
      .directory-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1em; margin-bottom: 0.5em; }
      .directory-buttons { display: flex; gap: 0.4em; flex: 0 0 auto; }
      .script-table { width: 100%; border-collapse: collapse; }
      .script-table th, .script-table td { text-align: left; padding: 0.3em 0.6em; border-bottom: 1px solid #eee; vertical-align: top; }
      .script-table th { font-weight: 600; color: #555; font-size: 0.9em; }
      .script-table tbody tr:last-child td { border-bottom: none; }
      .script-table td.size-cell, .script-table td.status-cell, .script-table td.toggle-cell { white-space: nowrap; width: 1%; }
      .script-table td.toggle-cell { padding-right: 0.2em; }
      /* When a source is off, its whole section dims; when a script is off, just the row dims.
         The toggle itself stays at full opacity so users can flip it back. */
      .directory.disabled .directory-header h2,
      .script-table tr.disabled td:not(.toggle-cell) { opacity: 0.45; }
      .toggle { display: inline-flex; align-items: center; cursor: pointer; }
      .toggle input[type="checkbox"] { cursor: pointer; margin: 0; }
      .toggle-disabled { cursor: not-allowed; opacity: 0.5; }
      .toggle-disabled input[type="checkbox"] { cursor: not-allowed; }
      .status-ok { color: #166534; }
      .status-error, .status-missing { color: #b00; }
      .empty { color: #666; font-style: italic; }
      .error { color: #b00; }
      .banner { border: 1px solid #d97706; background: #fffbeb; padding: 0.7em 1em; border-radius: 6px; margin-bottom: 1em; }
      .banner strong { display: block; margin-bottom: 0.3em; }
      .banner p { margin: 0.3em 0; }
      .banner code { background: #fef3c7; padding: 0.15em 0.4em; border-radius: 3px; user-select: all; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .banner a.chrome-link { display: inline-block; background: #fef3c7; padding: 0.15em 0.4em; border-radius: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #92400e; text-decoration: none; cursor: pointer; }
      .banner a.chrome-link:hover { text-decoration: underline; }
      .banner .banner-detail { color: #92400e; font-size: 0.85em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-top: 0.5em; }
      #version { font-size: 0.85em; color: #888; margin-top: 2em; }
    </style>
  </head>
  <body>
    <h1>VibeMonkey</h1>

    <div id="banner-slot"></div>

    <form id="add-form" class="add-form">
      <input id="add-path" type="text" placeholder="Absolute path to a userscripts directory" required autocomplete="off" spellcheck="false" />
      <button type="submit">Add directory</button>
    </form>

    <div id="directories"></div>

    <p id="version" class="placeholder"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
