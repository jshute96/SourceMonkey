<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SourceMonkey — Options</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
      h1 { margin-top: 0; }
      button { font: inherit; padding: 0.3em 0.8em; cursor: pointer; }
      .top-actions { display: flex; justify-content: flex-start; margin-bottom: 0.5em; }
      .settings { margin-top: 1em; }
      .settings-heading { font-size: 1em; margin: 0 0 0.5em; }
      .settings-row { display: inline-flex; align-items: center; gap: 0.5em; cursor: pointer; }
      .settings-row input[type="checkbox"] { cursor: pointer; margin: 0; }
      .settings-hint { margin: 0.3em 0 0; font-size: 0.85em; color: #666; }
      #version { font-size: 0.85em; color: #888; margin-top: 2em; }
    </style>
  </head>
  <body>
    <h1>SourceMonkey</h1>

    <div class="top-actions">
      <button id="open-sources" type="button" title="Open the sources page">Sources</button>
    </div>

    <div id="settings" class="settings">
      <h2 class="settings-heading">Settings</h2>
      <label class="settings-row">
        <input id="debug-logging" type="checkbox" />
        <span>Enable debug logging</span>
      </label>
      <p class="settings-hint">Logs per-navigation match lists and per-script update checks to the service-worker console. Off by default.</p>
    </div>

    <p id="version" class="placeholder"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
