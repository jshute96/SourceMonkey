<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VibeMonkey — Userscript</title>
    <link rel="stylesheet" href="vendor/prism/prism.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px system-ui, sans-serif;
        color: #222;
        display: flex;
        flex-direction: column;
        padding: 1em;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1em;
        font-weight: 600;
        margin: 0 0 0.6em;
        word-break: break-all;
      }
      #status { margin: 0 0 0.6em; }
      #status.error { color: #b00; }
      #status:empty { display: none; }
      /* Header summary above the code box. Hidden until parse succeeds
         (the parser may return null for files with no metadata block,
         in which case we just show the code). */
      #header-summary {
        margin: 0 0 0.8em;
        padding: 0.6em 0.8em;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f5f7fa;
      }
      #header-summary:empty { display: none; }
      #header-summary dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 0.8em;
        row-gap: 0.25em;
        margin: 0;
      }
      #header-summary dt {
        font-weight: 600;
        color: #555;
      }
      #header-summary dd {
        margin: 0;
        word-break: break-word;
      }
      #header-summary ul {
        margin: 0;
        padding-left: 1.1em;
      }
      /* The code box fills the rest of the viewport and scrolls. The
         padding/border give it a textbox-like look; tabindex makes it
         keyboard-focusable so it scrolls with arrow keys. */
      pre.code-box {
        flex: 1 1 auto;
        margin: 0;
        overflow: auto;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.8em;
        background: #fafafa;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      pre.code-box:focus { outline: 2px solid #4a90e2; outline-offset: -2px; }
    </style>
  </head>
  <body>
    <h1 id="filename"></h1>
    <p id="status"></p>
    <div id="header-summary"></div>
    <pre class="code-box" tabindex="0"><code id="content" class="language-javascript"></code></pre>
    <script src="vendor/prism/prism.js"></script>
    <script src="userscript.js" type="module"></script>
  </body>
</html>
