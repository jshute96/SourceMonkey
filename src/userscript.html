<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SourceMonkey | Userscript</title>
    <link rel="stylesheet" href="vendor/prism/prism.css" />
    <link rel="stylesheet" href="vendor/prism/prism-line-numbers.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px system-ui, sans-serif;
        color: #222;
        display: flex;
        flex-direction: column;
        padding: 1em;
        box-sizing: border-box;
      }
      /* No focus ring, ever. The `tabindex` in the body exists only so
         in-page navigation can park focus here for a screen reader to
         announce the new script from — the heading is not a control and
         is not tabbable, so a ring around it reads as a text field.
         `:focus-visible` is not the discriminator it looks like: Chrome
         counts a programmatic focus as visible when the focus it
         replaced came from the keyboard, so the ring appeared for some
         clicks and not others. */
      h1:focus { outline: none; }
      /* No hanging indent here, unlike the collections page's name cell:
         the favicon is no longer the first thing on the line (the
         "SourceMonkey | " / "SourceMonkey | Install " prefix is), so
         there is no single x-position for continuation lines to align
         to. */
      h1 {
        font-size: 1em;
        font-weight: 600;
        margin: 0 0 0.4em;
        /* Slash-aware wrap: prefer spaces / slashes (with `<wbr>`
           markers inserted by appendWithSlashBreaks), then anywhere
           inside a word only when nothing else fits. */
        overflow-wrap: anywhere;
        word-break: normal;
      }
      /* The product prefix is context around the script's name, not
         part of it, so it stays out of the name's weight. */
      h1 .heading-prefix {
        font-weight: 400;
        color: #555;
      }
      /* Fixed-width slot for the site favicon, sitting between the
         heading's product prefix and the script's name. Always present,
         so the name starts at the same offset past the prefix whether
         or not a favicon resolves. Holds a clickable <a> when the
         script's @match yields an origin, or an inert <span>
         otherwise. Inner content is a globe placeholder until the real
         favicon loads. */
      h1 .site-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 0.4em;
        vertical-align: text-bottom;
      }
      .site-icon-inner {
        display: block;
        width: 16px;
        height: 16px;
        color: #888;
      }
      a.site-icon-inner { text-decoration: none; }
      a.site-icon-inner:hover { color: #444; }
      h1 .site-icon img { width: 16px; height: 16px; display: block; }
      .site-icon-globe { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      /* Controls row: per-script enable toggle + Refresh button. The
         filename, size, and status moved into the details panel below
         where the dl gives them aligned label/value columns. */
      .meta-row {
        display: flex;
        align-items: center;
        gap: 1em;
        margin: 0 0 0.5em;
        font-size: 0.95em;
      }
      .meta-row[hidden] { display: none; }
      .meta-status { font-weight: 600; }
      .status-ok { color: #166534; }
      .status-invalid, .status-rejected, .status-missing, .status-error { color: #b00; }
      .status-warning, .status-outdated { color: #b67200; }
      .status-refresh-failed { color: #c2410c; }
      /* Status row is a link to the Log tab — keep it looking like
         status text (not a default blue underline). */
      .meta-status[href] { text-decoration: none; color: inherit; cursor: pointer; }
      .meta-status[href]:hover { text-decoration: underline; }
      .meta-row button { font: inherit; padding: 0.2em 0.7em; cursor: pointer; }
      .meta-row .toggle { display: inline-flex; align-items: center; gap: 0.3em; cursor: pointer; margin-left: auto; }
      .meta-row .toggle input[type="checkbox"] { cursor: pointer; margin: 0; }
      .meta-row .toggle.toggle-disabled { cursor: not-allowed; opacity: 0.5; }
      .meta-row .toggle.toggle-disabled input[type="checkbox"] { cursor: not-allowed; }
      .message { margin: 0 0 0.5em; }
      .message.error { color: #b00; }
      .message.refresh-failed { color: #c2410c; }
      .message:empty { display: none; }
      /* Preview-mode install callout, banner, and action row. With
         nothing installed, the callout IS the page's question — "Install
         into [collection]" — so it gets the box; when copies exist the
         banner takes that spot, in one box with the table that carries
         the choice. The row under either holds Cancel / View raw
         source. */
      .install-callout {
        display: flex;
        align-items: center;
        gap: 0.5em;
        flex-wrap: wrap;
        /* Same green as the versions panel: both are about
           where a copy of this script lives. */
        border: 1px solid #b9d4b1;
        background: #dbecd6;
        border-radius: 6px;
        padding: 10px 14px;
        margin: 0 0 10px;
      }
      .install-callout[hidden] { display: none; }
      .install-callout label { font-weight: 600; }
      .install-callout label[hidden] { display: none; }
      .install-callout button { font: inherit; padding: 0.35em 0.9em; cursor: pointer; }
      .install-callout button:disabled { cursor: not-allowed; opacity: 0.5; }
      .install-callout .primary { font-weight: 600; }
      .actions { display: flex; gap: 0.5em; align-items: center; margin: 0 0 0.7em; }
      .actions[hidden] { display: none; }
      .actions button { font: inherit; padding: 0.35em 0.9em; cursor: pointer; }
      .actions button:disabled { cursor: not-allowed; opacity: 0.5; }
      .actions .primary { font-weight: 600; }
      .actions .spacer { margin-left: auto; }
      /* The banner box is in styles.css (shared with the collections page,
         which is also where the file-access banner comes from). Only
         the viewer's own colour variant lives here — the amber default
         is a warning, and "already installed" is not. */
      /* Matches the versions panel — this banner is about which of
         those copies to act on, so the two share a ground before the
         `merged` rule below makes them literally one box. */
      .banner.installed { border-color: #b9d4b1; background: #dbecd6; }
      /* One line, not the block-level heading `.banner strong` gives
         every other banner: this one is a sentence with its follow-up
         in the same breath, and the table under it is what needs the
         vertical room. */
      .banner.installed strong { display: inline; margin-bottom: 0; }
      /* …and when both are on screen they are literally one box: the
         wrapper takes the green card and the two children give up
         their own borders, so "This script is already installed" and
         the table of copies read as one statement rather than two
         stacked cards in the same colour. Only the preview's installed
         case sets `merged` (renderInstalledBanner); a warning banner
         raised alongside keeps its own amber box inside. */
      #status-box.merged {
        border: 1px solid #b9d4b1;
        background: #dbecd6;
        border-radius: 6px;
        padding: 10px 14px;
        margin: 0 0 10px;
      }
      #status-box.merged .banner.installed {
        border: 0;
        background: none;
        padding: 0;
        margin: 0;
        border-radius: 0;
      }
      /* The blank line between the banner's one line and the first row
         of the table is this margin — a preview's panel draws no
         heading of its own, so nothing else separates them. */
      #status-box.merged #other-versions {
        border: 0;
        background: none;
        padding: 0;
        margin: 14px 0 0;
      }
      @keyframes sm-spin { to { transform: rotate(360deg); } }
      .busy-spinner { display: inline-block; width: 12px; height: 12px; margin-left: -0.2em; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: sm-spin 0.7s linear infinite; box-sizing: border-box; }
      /* @connect row: hostnames and match rules, not prose. */
      .host-list { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      /* The "loaded from local disk" chip, worn by a code tab whose
         body came off local disk rather than from the URL its
         declaration names. Loud enough to notice without hovering,
         which is the whole reason that fact isn't left to the
         tooltip. */
      .tab-mark {
        padding: 0 0.4em;
        border-radius: 3px;
        background: #d97706;
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      /* Details panel: the header fields worth surfacing (when a
         metadata block is present) plus the resolved Collection /
         Location / Size / Status rows. Cleared via :empty when there's
         no script. */
      #header-summary {
        margin: 0 0 11px;
        padding: 8px 11px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f5f7fa;
      }
      #header-summary:empty { display: none; }
      #header-summary dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 0.8em;
        row-gap: 0.25em;
        margin: 0;
      }
      #header-summary dt {
        font-weight: 600;
        color: #555;
      }
      #header-summary dd {
        margin: 0;
        /* Slash-aware wrap for any long URL/path that lands in a
           dd value (Location, Match, Exclude patterns, …). */
        overflow-wrap: anywhere;
        word-break: normal;
      }
      /* An upstream copy that's ahead of the one we run — same amber as
         the OUTDATED status this row is the detail behind. Only the
         "newer" direction is highlighted; running ahead of the published
         version is normal for a local edit. */
      #header-summary dd.version-newer {
        color: #b67200;
        font-weight: 600;
      }
      #header-summary ul {
        margin: 0;
        padding-left: 1.1em;
      }
      /* Location row: path text + a square copy-icon button to its
         right. min-width:0 lets long paths shrink and wrap rather
         than blow out the grid column. */
      .filename-cell {
        display: flex;
        align-items: center;
        gap: 0.4em;
        min-width: 0;
      }
      .filename-text {
        /* Slash-aware wrap; see h1 above. */
        overflow-wrap: anywhere;
        word-break: normal;
        min-width: 0;
      }
      /* Local overrides row: one entry per overridden `@require` /
         `@resource`. Same flex shape as the Location cell — it's the
         same kind of value (a path plus its copy button). */
      .local-override-cell {
        display: flex;
        align-items: baseline;
        gap: 0.4em;
        min-width: 0;
      }
      /* The `@require` / `@resource` tag that says which kind of
         declaration this entry stood in for. Muted and monospace: it's
         a label on the path beside it, not the value. */
      .local-override-kind {
        flex: none;
        color: #777;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }
      .local-override-path {
        /* Slash-aware wrap; see h1 above. */
        overflow-wrap: anywhere;
        word-break: normal;
        min-width: 0;
      }
      /* The copy button sits on the text baseline in a flex row that
         otherwise aligns on it; nudge it back to optical centre. */
      .local-override-cell .copy-btn { align-self: center; }
      /* Anchors in the details panel (Match patterns, Location)
         read as plain text by default; underline only on hover so
         the rows stay calm. The bubble is excluded so its `color:#fff`
         survives — its hover affordance is the opacity dip below. */
      #header-summary dd a:not(.collection-type-bubble) { color: inherit; text-decoration: none; }
      #header-summary dd a:not(.collection-type-bubble):hover { text-decoration: underline; }
      /* Anchors inside the highlighted code block. Inherit Prism's
         token color (comment-grey, string-green, etc.) so the code
         box keeps reading as code; only the hover underline signals
         clickability. */
      pre.code-box a.code-link { color: inherit; text-decoration: none; }
      pre.code-box a.code-link:hover { text-decoration: underline; }
      /* `.log-id-cell` deliberately has no rules: the log ID reads as
         regular text like every other value in the panel. It's a
         filename, not code, and it was the only monospace row. The
         class stays as a hook for finding the cell. Wrapping comes from
         the `dd`'s own slash-aware rule. */
      /* ---- "Other versions" panel (src/related-versions.ts) ----
         Sits at the top of the page, under the title and above the
         controls row: which copy you are looking at comes before
         anything that acts on it. Same card shape as #header-summary
         further down, but a green ground rather than that panel's
         grey — this is the one that carries live controls, so it has
         to read as a different kind of thing at a glance. Empty when
         nothing relates, and hidden by the :empty rule rather than a
         `hidden` attribute the renderer would have to manage. */
      #other-versions {
        margin: 0 0 11px;
        padding: 8px 11px;
        border: 1px solid #b9d4b1;
        border-radius: 4px;
        background: #dbecd6;
      }
      #other-versions:empty { display: none; }
      /* Heading line: the title, and the fold control pushed to the
         far corner. The gap below belongs to the line rather than to
         the <h2>, so a folded panel is exactly one line tall with no
         trailing space under it. */
      .versions-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 8px;
      }
      .versions-head.collapsed { margin: 0; }
      /* …except when a failure line follows the folded heading: the two
         are the whole panel then, and they still need a gap. */
      .versions-head.collapsed + .versions-message { margin-top: 8px; }
      #other-versions h2 {
        font-size: 1.1em;
        font-weight: 650;
        color: #333;
        line-height: 18px;
        margin: 0;
      }
      /* A bare triangle, quiet until pointed at: it sits above the
         panel's own controls and must not compete with them. Padded out
         to a real target — it is the panel's only fold affordance, and
         the glyph itself is a few pixels wide. */
      .versions-collapse {
        flex: none;
        border: 0;
        border-radius: 3px;
        background: none;
        padding: 0 6px;
        font-size: 12px;
        line-height: 18px;
        color: #4a6a44;
        cursor: pointer;
      }
      .versions-collapse:hover { background: #cbe3c5; color: #223; }
      /* A bare glyph has no shape of its own to show focus with — and
         this is the control the fold hands focus back to. */
      .versions-collapse:focus-visible { outline: 2px solid #4a90e2; outline-offset: 1px; }
      .versions-section-heading {
        font-size: 1em;
        font-weight: 600;
        color: #444;
        line-height: 16px;
        margin: 13px 0 4px;
      }
      .versions-section-heading:first-of-type { margin-top: 0; }
      /* The parenthesized gloss names which match produced the rows
         below. It belongs to the heading, so it lives inside the
         <h3> — but at body weight, or the two sections would read as
         equally emphatic. */
      .versions-heading-gloss {
        font-weight: 400;
        color: #777;
        font-size: 12px;
      }
      /* A heading row that is there for a screen reader and not for the
         eye — the install-offer section's, whose labels the section
         above it has already shown (see `makeTable`). Taken out of
         flow rather than `display: none`, which drops it from the
         accessibility tree along with the page. */
      .versions-table thead.visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* `fixed` + the <colgroup> the renderer emits is what keeps the
         two sections' columns aligned with each other: without it each
         <table> sizes its own columns from its own content and the
         panel reads as two unrelated grids. */
      /* Whole-px vertical metrics in this panel, and `separate` borders
         rather than `collapse` (a collapsed border is split half into each
         adjacent cell, landing rows on half pixels) — see
         docs/architecture.md, "Extension-page styling". */
      .versions-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
      }
      /* Status, Version, and the actions column are sized to their own
         widest content by `fitColumns` (related-versions.ts), which
         writes the three custom properties below onto the panel. The
         fallbacks are what the first paint uses and what a measurement
         of a hidden panel falls back to: wide enough for REFRESH
         FAILED and a date-shaped @version. Everything left over goes to
         Location, which is the column that can always use it. */
      .versions-table col.col-enabled  { width: 2.2em; }
      .versions-table col.col-collection { width: 26%; }
      .versions-table col.col-status   { width: var(--w-col-status, 8em); }
      .versions-table col.col-version  { width: var(--w-col-version, 7em); }
      .versions-table col.col-actions  { width: var(--w-col-actions, 6em); }
      .versions-table col.col-remove   { width: 2.4em; }
      /* Same #444 as the section heading above the table: the panel's
         two kinds of heading are both headings, and at 11px uppercase
         a lighter grey reads as faded rather than as secondary. */
      .versions-table th {
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0 6px 2px 0;
        border-bottom: 1px solid #b9d4b1;
      }
      .versions-table td {
        padding: 5px 7px 5px 0;
        line-height: 16px;
        vertical-align: top;
        border-bottom: 1px solid #c9e0c2;
      }
      .versions-table tr:last-child td { border-bottom-color: transparent; }
      .versions-table .col-actions {
        text-align: right;
        padding-right: 0;
        white-space: nowrap;
      }
      .versions-table th.col-actions button { font-size: 12px; padding: 1px 8px; }
      /* Type styling for the body cells is scoped to `td`, here and in
         the Location rule below. A column class sits on the `th` too,
         and `.versions-table .col-x` outranks `.versions-table th`, so
         an unscoped `color` / `font-size` here leaks into that
         column's heading — which is how COLLECTION, LOCATION, STATUS
         and VERSION ended up drawn in three combinations of size and
         grey. The heading row is one row and reads as one. */
      .versions-table td.col-version {
        color: #555;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      /* A wider right gutter than the other columns get: these two are
         measured to their content, so without it the widest status
         would sit hard against the version beside it. On the `th` as
         well, so heading and values share an edge, and inside the
         measured width, so the gutter survives the fit. */
      .versions-table .col-status,
      .versions-table .col-version { padding-right: 1.1em; }
      /* Status reuses the `status-*` colours the controls row and the
         collections page already use, so one verdict is one colour
         everywhere, and styles its link as status text — see
         docs/script-identity.md for why the colour, not the underline,
         is what has to carry. */
      .versions-table td.col-status { font-size: 12px; }
      .versions-table .col-status a {
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .versions-table .col-status a:hover { text-decoration: underline; }
      /* Slash-aware wrap; see the h1 rule above. `min-width: 0` lets
         a long URL shrink its column rather than widening the table. */
      .versions-table .col-collection,
      .versions-table .col-location {
        overflow-wrap: anywhere;
        word-break: normal;
        min-width: 0;
      }
      .versions-table td.col-location { font-size: 12px; color: #555; }
      .versions-collection-name {
        color: inherit;
        text-decoration: none;
        font-weight: 500;
      }
      .versions-collection-name:hover { text-decoration: underline; }
      .versions-table .col-location a { color: inherit; text-decoration: none; }
      .versions-table .col-location a:hover { text-decoration: underline; }
      /* A deeper tint of the panel's own green, not the blue used
         elsewhere for "current" — on this ground a blue row would read
         as a different kind of highlight rather than as emphasis. */
      .versions-table tr.is-current { background: #c3e0ba; }
      /* Rows that select their copy when clicked anywhere that isn't a
         control (installed mode only — see `versionRow`). The hover
         tint stops short of the current row's, so "the row under the
         pointer" and "the row you are on" stay distinguishable while
         the pointer is over one of them. */
      .versions-table tr.is-navigable { cursor: pointer; }
      .versions-table tr.is-navigable:hover { background: #d3e8cb; }
      /* The rows are the tab stops the Location links used to be, so
         they need a ring of their own — the current row included: it
         takes focus after a selection and on the Up/Down walk, even
         though activating it does nothing. Inset, because an outline
         drawn outside a table row is clipped by the row above it. */
      .versions-table tr.is-navigable:focus-visible,
      .versions-table tr.is-current:focus-visible {
        outline: 2px solid #4a7f3d;
        outline-offset: -2px;
      }
      .versions-current-marker { color: #666; }
      .versions-this-page { font-weight: 700; color: #333; }
      .versions-table tr.is-offer .versions-offer-text {
        color: #888;
        font-style: italic;
      }
      /* The install-offer row's controls, in the one cell that spans
         everything left of Location (see `installRow`). Stacked —
         label, dropdown, button — so they read as the callout's one
         question does, and so the button stays next to the dropdown
         that decides what it will do rather than out at the table's
         right edge. Label beside the dropdown, button under both, and
         the disabled-button explanation beside the button. */
      .versions-table td.col-install { padding-right: 10px; }
      /* Label and dropdown on one line. `min-width: 0` on the select is
         what lets it give way to the label instead of overflowing the
         cell — a flex item's default floor is its content width, and a
         long collection name is wider than two columns. */
      .install-offer-pick {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .install-offer-label { font-weight: 600; }
      .install-offer-pick select { flex: 1 1 auto; min-width: 0; }
      /* Install, and beside it the line saying why it is off. */
      .install-offer-go {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
        margin-top: 5px;
      }
      /* Same floor as the dropdown two rules up, and for the same
         reason: a flex item's automatic minimum is its longest word, so
         without it the note widens the cell rather than wrapping in it.
         `flex-wrap` above then drops it under the button when even a
         wrapped note won't fit beside one. */
      .install-offer-note { min-width: 0; }
      .versions-table td.col-install button {
        flex: none;
        font: inherit;
        font-weight: 600;
        padding: 0.35em 0.9em;
        cursor: pointer;
      }
      /* Greyed by explicit colours, not by `opacity` — on this panel's
         green ground a translucent button takes the green on and stops
         reading as a disabled control at all. */
      .versions-table td.col-install button:disabled {
        cursor: not-allowed;
        background: #ececec;
        border-color: #c2c2c2;
        color: #999;
      }
      /* Why Install is off. Empty — and so invisible — otherwise. */
      .install-offer-note {
        font-size: 12px;
        color: #666;
        font-style: italic;
      }
      .versions-table .toggle {
        display: inline-flex;
        align-items: center;
        cursor: pointer;
      }
      .versions-table .toggle input[type="checkbox"] { cursor: pointer; margin: 0; }
      /* Same treatment as the controls-row toggle when the parent
         collection is off: the box can't be clicked, so it must not look
         clickable. */
      .versions-table .toggle.toggle-disabled { cursor: not-allowed; opacity: 0.5; }
      .versions-table .toggle.toggle-disabled input[type="checkbox"] { cursor: not-allowed; }
      /* Trash can, in its own column hard against the table's right
         edge. Same glyph and red hover as the collections page's
         `.remove-script`, so the two read as one control in two
         places; the border and resting colour are the panel's own,
         since it sits on green rather than white. Disabled (a script
         inside a collection) keeps the button on screen — the
         column would otherwise look ragged with no clue why — but
         drops it to a plain dimmed glyph with no border, so it doesn't
         invite a click its tooltip has to then refuse. `not-allowed`
         to match the disabled toggle two rules up. */
      .versions-table .col-remove {
        text-align: right;
        padding-right: 0;
        white-space: nowrap;
      }
      .versions-remove {
        padding: 0 0.3em;
        font: inherit;
        line-height: 1;
        border: 1px solid #b9d4b1;
        border-radius: 3px;
        background: transparent;
        cursor: pointer;
        color: #6a7b66;
      }
      .versions-remove:hover:not(:disabled) { background: #f5c2c7; color: #b00; }
      /* A bare glyph has no shape of its own to show focus with. */
      .versions-remove:focus-visible { outline: 2px solid #4a90e2; outline-offset: 1px; }
      .versions-remove:disabled {
        cursor: not-allowed;
        border-color: transparent;
        opacity: 0.35;
      }
      /* The panel reports its own action failures here rather than in
         the page's `#message` bar — see related-versions.ts. */
      .versions-message {
        margin: 0 0 0.5em;
        color: #b3261e;
        font-size: 12px;
      }
      /* Narrow windows shed the Version column rather than letting
         every cell wrap to an unreadable ribbon. It is the least
         load-bearing: nothing acts on it, and the copies it
         distinguishes are still distinguished by collection and location.
         It stays in the DOM (hidden, not dropped) so nothing has to
         re-render on resize.
         Zeroing the <col> width alongside `display: none` on the
         cells is what actually reclaims the space: under
         `table-layout: fixed` the colgroup, not the cells, is what
         sets column width.

         Status does not shed either: it is the column that says
         whether a copy is actually working, and its link is the only
         route to that copy's log from here.

         Location does NOT shed, though it used to. Its link is the
         only way to reach another copy's page now that a preview with
         several targets drops its header Open button in favour of this
         table — hiding it would leave a narrow window with no route to
         a copy at all. Wrapping a long path is the lesser cost. */
      @media (max-width: 640px) {
        .versions-table col.col-version { width: 0; }
        .versions-table .col-version { display: none; }
      }
      /* Collection row layout. Grid layout so a long display name wraps
         inside the middle column instead of dropping back to the row's
         left edge. The bubble's own styling (color, padding, hover) is
         in styles.css, the cross-page shared stylesheet. */
      /* `minmax(0, max-content)` on the name, not `1fr`: a name that
         fits keeps its natural width, so the Move button sits right
         after it instead of being flung to the margin. A name too long
         for the row fills the track, wraps inside it, and the button
         ends up at the right edge — which is where it belongs once
         there is no "right after the name" to sit at. */
      .collection-cell {
        display: grid;
        grid-template-columns: max-content minmax(0, max-content) max-content;
        column-gap: 0.5em;
        align-items: baseline;
        min-width: 0;
      }
      /* Move control: a column of its own, so a wrapping name never
         drags it down onto the last wrapped line. */
      .collection-move {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      /* No font or padding of its own, deliberately: that is exactly
         what the versions table's row buttons get, so both land on the
         UA's default button metrics and come out the same height. The
         details rows read badly if one control stands taller than the
         rest. */
      .collection-move button { cursor: pointer; }
      /* Square icon-only button. Swaps the copy icon for a checkmark
         while the .copied class is on it (set briefly after a
         successful clipboard write). */
      .copy-btn {
        flex: 0 0 auto;
        width: 1.6em;
        height: 1.6em;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #bbb;
        border-radius: 3px;
        background: #fff;
        color: #444;
        cursor: pointer;
      }
      .copy-btn:hover { background: #eee; }
      .copy-btn:focus-visible { outline: 2px solid #4a90e2; outline-offset: 1px; }
      .copy-btn svg { width: 14px; height: 14px; display: block; }
      .copy-btn .check-icon { display: none; color: #166534; }
      .copy-btn.copied .copy-icon { display: none; }
      .copy-btn.copied .check-icon { display: block; }
      /* Tab strip above the code box: one tab per source file (main
         script + each @require). Always rendered. The strip sits
         entirely above the code box (no overlap, no negative margin
         tricks) so the layout is robust against the body's flex
         column constraints. */
      .tabs {
        display: flex;
        flex: 0 0 auto;
        gap: 3px;
        margin: 0;
        padding: 0;
        overflow-x: auto;
      }
      .tab {
        font: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.2;
        padding: 0.45em 0.9em;
        border: 1px solid #ccc;
        border-radius: 4px 4px 0 0;
        background: #e4e4e4;
        color: #555;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab:hover { background: #efefef; }
      .tab.active {
        background: #fafafa;
        color: #222;
        font-weight: 600;
        border-bottom-color: #fafafa;
      }
      .tab:focus-visible { outline: 2px solid #4a90e2; outline-offset: -2px; }
      /* Positioning only — the chip's own look is above. */
      .tab-mark { margin-left: 0.5em; vertical-align: 1px; }
      /* The code box fills the rest of the viewport and scrolls. The
         padding/border give it a textbox-like look; tabindex makes it
         keyboard-focusable so it scrolls with arrow keys. The
         top-left rounding is dropped so the active tab meets the box
         cleanly along that edge. margin-top:-1px lets the active tab's
         transparent bottom border merge with the code box's top
         border so the active tab visually "opens into" the box. */
      pre.code-box {
        flex: 1 1 auto;
        margin: -1px 0 0;
        overflow: auto;
        border: 1px solid #ccc;
        border-radius: 0 4px 4px 4px;
        padding: 0.8em;
        background: #fafafa;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      pre.code-box:focus { outline: 2px solid #4a90e2; outline-offset: -2px; }
      /* Tinted band behind the `// ==UserScript== … // ==/UserScript==`
         block. `display: block` lets the band span every header line;
         the negative left/right margin (paired with matching padding)
         extends the band out to the code-box's padding edges so it
         reads as a full-width strip rather than a floating rectangle.
         The grey paint lives on a ::before with z-index: -1 (rather
         than `background:` on the span) so the line-highlight
         overlay can sit at the same z-index and, by document order,
         paint over the grey when a header line is highlighted. */
      pre.code-box .token.userscript-header {
        display: block;
        position: relative;
        margin: 0 -0.8em;
        padding: 0 0.8em;
      }
      pre.code-box .token.userscript-header::before {
        content: '';
        position: absolute;
        inset: 0;
        background: #f0f0f0;
        z-index: -1;
      }
      /* Log pane mirrors the code box's outer dimensions so swapping
         between a code tab and the Log tab doesn't reflow the page.
         Same border/margin trick as .code-box so the active Log tab's
         bottom border merges with the pane's top border. */
      .log-pane {
        flex: 1 1 auto;
        margin: -1px 0 0;
        overflow: auto;
        border: 1px solid #ccc;
        border-radius: 0 4px 4px 4px;
        background: #fafafa;
      }
      .log-pane[hidden] { display: none; }
      .log-pane:focus { outline: 2px solid #4a90e2; outline-offset: -2px; }
      .log-pane table {
        width: 100%;
        border-collapse: collapse;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .log-pane th, .log-pane td {
        padding: 0.35em 0.6em;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid #eee;
      }
      .log-pane th {
        background: #f0f0f0;
        font-weight: 600;
        color: #555;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .log-pane td.log-ts { white-space: nowrap; color: #555; }
      .log-pane td.log-source { white-space: nowrap; color: #555; }
      .log-pane td.log-msg { white-space: pre-wrap; word-break: break-word; }
      .log-pane td.log-level { white-space: nowrap; }
      .log-pane .log-level-badge {
        display: inline-block;
        padding: 0 0.45em;
        border-radius: 3px;
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .log-pane .log-level-info    { background: #e7eef7; color: #345; }
      .log-pane .log-level-warning { background: #fdf1c5; color: #6b4f00; }
      .log-pane .log-level-error   { background: #fbe2e2; color: #8a1d1d; }
      .log-empty {
        padding: 1em;
        color: #777;
        font: 13px system-ui, sans-serif;
      }
      .log-toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 0.4em;
        padding: 0.4em 0.6em;
        border-bottom: 1px solid #eee;
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 2;
      }
      .log-toolbar button {
        font: inherit;
        padding: 0.2em 0.7em;
        cursor: pointer;
      }
      /* Save/Copy are disabled while the log is empty — there is
         nothing to hand out but a header row. */
      .log-toolbar button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      /* Clickable `sourcemonkey://…:L:C` refs inside log messages.
         The log table renders with a monospace font, so a regular
         blue underline reads clearly without disrupting the column. */
      .log-pane .log-stack-link {
        color: #1d4ed8;
        text-decoration: underline;
        cursor: pointer;
      }
      .log-pane .log-stack-link:hover { color: #2563eb; }
      /* The `(in <file>, line N, column M)` part of a diagnostic we
         derived ourselves — a header problem, a bad `@require`, a
         syntax error. Appears in three places with three different
         surrounding colours (the red `.message` bar, an amber banner,
         a Log row), so it inherits the surrounding weight and marks
         itself only with an underline and the monospace face the file
         name deserves. `color: inherit` keeps the red error bar red
         rather than half red and half blue. */
      .diagnostic-link {
        color: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-decoration: underline;
        cursor: pointer;
      }
      .diagnostic-link:hover { text-decoration-thickness: 2px; }
      /* The line-numbers plugin makes <code> position: relative but
         leaves it inline; without an explicit display:block the
         absolute .line-flash overlay below sizes to the line box
         instead of the full code area. `z-index: 0` turns <code>
         into a stacking context so the highlight overlay can sit
         BEHIND the text via z-index: -1 without escaping <code>. */
      pre.code-box.line-numbers > code { display: block; z-index: 0; }
      /* Highlight overlay used by the log-message link click handler
         and the clickable line-number gutter. Sits BEHIND the
         syntax-highlighted text so the line stays maximally
         readable. Persists until the user highlights a different
         line or switches to a different tab (tab swap replaces
         <code>'s textContent and the overlay with it). */
      .line-flash {
        position: absolute;
        /* Extend by 0.8em on each side so the highlight covers the
           full visual extent of any line — including the userscript
           header band, which uses `margin: 0 -0.8em` to reach the
           code-box's padding edges. */
        left: -0.8em;
        right: -0.8em;
        pointer-events: none;
        background: #fff3a6;
        z-index: -1;
      }
      /* Vertical accent bar inside .line-flash. Rendered only when
         the highlight came from a stack ref that carried a column;
         inline `left:` is set to (col - 1) * char width so the bar
         points at the reported character position. */
      .line-flash-col-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #f5b500;
        pointer-events: none;
      }
      /* Make the line-numbers gutter behave like a clickable strip:
         each line number highlights its row when clicked. The plugin
         renders the numbers via `::before` on the span, so we set
         pointer-events: auto on the span (default is `none` on the
         parent rows) and add a hover affordance. */
      .line-numbers .line-numbers-rows.clickable {
        pointer-events: auto;
      }
      .line-numbers .line-numbers-rows.clickable > span {
        cursor: pointer;
      }
      .line-numbers .line-numbers-rows.clickable > span:hover::before {
        color: #1d4ed8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Shared globe glyph referenced by the icon slot's <use href="#sm-globe">
         (see collections.html for the rationale). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sm-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></symbol></svg>
    <!-- `tabindex="-1"` so in-page navigation between copies can move
         focus here: the heading, the details, and the code all change
         with no document load for a screen reader to announce. Not
         reachable by Tab, and it draws no focus ring (see the h1 rule
         in the stylesheet above). -->
    <h1 id="filename" tabindex="-1"></h1>
    <!-- Banner + versions panel, directly under the title and ABOVE the
         controls row: which copies of this script exist is the first
         thing either mode has to answer, and every control below acts
         on the one copy this page is showing. In the preview's
         "already installed" case the two are merged into one box (the
         `merged` class) — see `renderInstalledBanner`. -->
    <div id="status-box">
      <!-- In preview mode (`?preview=<url>`) the banner says what this
           file is relative to what's installed, and the action row asks
           the install / update question; the action row stays hidden for
           an installed script, which uses the controls row below. The
           banner slot is shared with the file-access banner, which either
           mode can raise when a local read fails. -->
      <div id="banner-slot"></div>
      <div id="other-versions"></div>
    </div>
    <div id="meta-row" class="meta-row" hidden>
      <label id="enable-label" class="toggle" title="Enable this script">
        <input id="enable-checkbox" type="checkbox" />
        <span>Enabled</span>
      </label>
      <button id="refresh-btn" type="button">Refresh</button>
    </div>
    <!-- Install stays hidden until the fetch has landed and we know
         whether this file is installable and not already installed,
         so it is never clickable without a handler behind it. The
         dropdown is filled per preview (see `showInstallCallout`); it
         is absent for a location with no single-file spelling, where
         Install adds a whole collection instead. -->
    <div id="install-callout" class="install-callout" hidden>
      <label id="install-target-label" for="install-target">Install into</label>
      <span id="install-target-slot"></span>
      <button id="install-btn" class="primary" type="button">Install</button>
    </div>
    <div id="preview-actions" class="actions" hidden>
      <button id="open-btn" type="button" hidden>Open installed script</button>
      <button id="continue-btn" class="primary" type="button" hidden
              title="Open this location in the browser, without previewing it">Continue to page</button>
      <button id="cancel-btn" type="button">Cancel</button>
      <button id="view-source-btn" class="spacer" type="button" title="Open the unprocessed file in a new tab">View raw source</button>
    </div>
    <p id="message" class="message"></p>
    <div id="header-summary"></div>
    <div id="tabs" class="tabs" role="tablist" hidden></div>
    <pre id="code-pane" class="code-box line-numbers" tabindex="0"><code id="content" class="language-javascript"></code></pre>
    <div id="log-pane" class="log-pane" tabindex="0" role="tabpanel" hidden></div>
    <script src="vendor/prism/prism.js"></script>
    <script src="vendor/prism/prism-line-numbers.js"></script>
    <script src="userscript.js" type="module"></script>
  </body>
</html>
