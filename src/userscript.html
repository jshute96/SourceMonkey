<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VibeMonkey — Userscript</title>
    <link rel="stylesheet" href="vendor/prism/prism.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px system-ui, sans-serif;
        color: #222;
        display: flex;
        flex-direction: column;
        padding: 1em;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1em;
        font-weight: 600;
        margin: 0 0 0.4em;
        word-break: break-all;
      }
      /* Header row mirrors the options-page table: filename above,
         size + status + Refresh in a single line below. */
      .meta-row {
        display: flex;
        align-items: center;
        gap: 1em;
        margin: 0 0 0.5em;
        font-size: 0.95em;
      }
      .meta-row[hidden] { display: none; }
      .meta-label { color: #555; margin-right: 0.3em; }
      .meta-status { font-weight: 600; }
      .status-ok { color: #166534; }
      .status-error, .status-missing { color: #b00; }
      .meta-row button { font: inherit; padding: 0.2em 0.7em; cursor: pointer; }
      .meta-row .toggle { display: inline-flex; align-items: center; gap: 0.3em; cursor: pointer; margin-left: auto; }
      .meta-row .toggle input[type="checkbox"] { cursor: pointer; margin: 0; }
      .meta-row .toggle.toggle-disabled { cursor: not-allowed; opacity: 0.5; }
      .meta-row .toggle.toggle-disabled input[type="checkbox"] { cursor: not-allowed; }
      .message { margin: 0 0 0.5em; }
      .message.error { color: #b00; }
      .message:empty { display: none; }
      /* Header summary above the code box. Hidden until parse succeeds
         (the parser may return null for files with no metadata block,
         in which case we just show the code). */
      #header-summary {
        margin: 0 0 0.8em;
        padding: 0.6em 0.8em;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f5f7fa;
      }
      #header-summary:empty { display: none; }
      #header-summary dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 0.8em;
        row-gap: 0.25em;
        margin: 0;
      }
      #header-summary dt {
        font-weight: 600;
        color: #555;
      }
      #header-summary dd {
        margin: 0;
        word-break: break-word;
      }
      #header-summary ul {
        margin: 0;
        padding-left: 1.1em;
      }
      /* The code box fills the rest of the viewport and scrolls. The
         padding/border give it a textbox-like look; tabindex makes it
         keyboard-focusable so it scrolls with arrow keys. */
      pre.code-box {
        flex: 1 1 auto;
        margin: 0;
        overflow: auto;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.8em;
        background: #fafafa;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      pre.code-box:focus { outline: 2px solid #4a90e2; outline-offset: -2px; }
    </style>
  </head>
  <body>
    <h1 id="filename"></h1>
    <div id="meta-row" class="meta-row" hidden>
      <span><span class="meta-label">Size:</span><span id="meta-size"></span></span>
      <span><span class="meta-label">Status:</span><span id="meta-status" class="meta-status"></span></span>
      <label id="enable-label" class="toggle" title="Enable this script">
        <input id="enable-checkbox" type="checkbox" />
        <span>Enabled</span>
      </label>
      <button id="refresh-btn" type="button">Refresh</button>
    </div>
    <p id="message" class="message"></p>
    <div id="header-summary"></div>
    <pre class="code-box" tabindex="0"><code id="content" class="language-javascript"></code></pre>
    <script src="vendor/prism/prism.js"></script>
    <script src="userscript.js" type="module"></script>
  </body>
</html>
