<!-- Shared glyph sprite: the one copy of every inline SVG glyph in the
     extension. scripts/build.mjs inlines it into each page wherever the
     page writes an `#include glyph-sprite` marker comment. (Spelling
     that marker out here would be nice, but its own closing `--` plus
     `>` would end THIS comment and spill the rest onto the page.)

     One source of truth: the markup used to be copy-pasted into each
     page's HTML, which is how two pages end up with glyphs that have
     quietly drifted apart.

     Each symbol is defined once per page and referenced by a `use`
     element, so a hundred rows share one copy of the path data instead
     of inlining it per row.

       #sm-globe      favicon placeholder until a site icon loads, and
                      the permanent icon for a script with no resolvable
                      origin (src/extension/site-icon.ts; styling on
                      `.site-icon-globe`).
       #sm-trash      remove SourceMonkey's record of a script.
       #sm-trash-file delete the script FILE from disk — the same can,
                      badged with a disk. Both painted by
                      src/extension/delete-icon.ts, which explains the pair.
                      The can is drawn ~19% smaller than #sm-trash — its
                      own inner scale(.9) inside the normalizing
                      wrapper's scale(.9) — so the badge has a corner to
                      sit in without swallowing the can. Deliberate: the two appear in the same
                      column in the "Other versions" panel, and the
                      badged one has to stay a can at 15px.
       #sm-copy       the viewer's "copy this to the clipboard" button,
       #sm-check      and the checkmark it flashes on success
                      (src/extension/copy-button.ts).
       #sm-refresh    refetch a collection, a script, or one row of the
                      "Other versions" table. Its busy state is this
                      same arc spinning (`.btn-glyph.spinning`), so the
                      button never changes shape mid-refresh.
       #sm-gear       open a collection's rename / options dialog.
       #sm-swap       the compare page's "swap the two sides" button:
                      two arrows, one each way, the same width so their
                      ends line up.

     Colour comes from `currentColor`, so a button's own `color` (and
     its hover) drives the glyph.

     OPTICAL SIZING — read before editing a path or a stroke width.
     Identical 16px boxes do not make icons look the same size; the ink
     inside them has to match too. As drawn, these ranged from 18 to
     23.3 units of 24, and the gear read ~22% larger than the arrow. So
     a glyph that needed resizing is wrapped in
       <g transform="translate(12 12) scale(k) translate(-12 -12)">
     and its `stroke-width` is DIVIDED by the same k. Consequences:
     - The number in the file is not the number that renders. Every
       glyph here strokes at 1.75 units once its wrapper is applied
       (1.9/... , 1.95/.9, 1.667*1.05, 1.825*.959). Change a stroke
       width and you break that unless you change k with it.
     - #sm-refresh translates by -13, not -12: Feather's rotate-cw is
       drawn a unit right of centre, and this puts it back. It is not
       a typo.
     - #sm-copy and #sm-check are deliberately outside this: they
       stroke at 2.0 and live alone in the 14px copy button, never
       beside the 1.75 set. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="sm-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></symbol>
<symbol id="sm-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h17"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M10 10.5v7"></path><path d="M14 10.5v7"></path></symbol>
<symbol id="sm-trash-file" viewBox="0 0 24 24"><g transform="translate(12 12) scale(.9) translate(-12 -12)"><mask id="sm-trash-file-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"></rect><circle cx="19.6" cy="19.6" r="5.2" fill="#000"></circle></mask><g mask="url(#sm-trash-file-cut)" transform="translate(-.7 -1.5) scale(.9)" fill="none" stroke="currentColor" stroke-width="2.167" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h17"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path><path d="M10 10.5v7"></path><path d="M14 10.5v7"></path></g><g transform="translate(14.53 14.36) scale(.422)" fill="none" stroke="currentColor" stroke-width="4.611" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path></g></g></symbol>
