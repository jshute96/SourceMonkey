<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SourceMonkey — Collections</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
      h1 { margin-top: 0; }
      /* Grid layout so a long display name that needs to wrap stays
         inside the right-hand column instead of dropping back to the
         row's left edge. Column 1 sizes to the bubble; column 2 takes
         the remaining space and is where the name wraps. */
      h2 {
        font-size: 1em;
        margin: 0;
        word-break: break-all;
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 0.5em;
        align-items: baseline;
      }
      /* `.collection-type-bubble` + colored `.bubble-*` variants +
         `.collection-display-name` typography are in styles.css (the
         cross-page shared stylesheet). */
      button { font: inherit; padding: 0.3em 0.8em; cursor: pointer; }
      input[type="text"] { font: inherit; padding: 0.3em 0.5em; }
      .placeholder { color: #666; }
      .add-form { display: flex; gap: 0.5em; margin-bottom: 1em; align-items: center; }
      .add-form input[type="text"] { flex: 1 1 auto; }
      .collection { border: 1px solid #ddd; border-radius: 6px; padding: 0.8em 1em; margin-bottom: 0.8em; }
      .collection-header { display: flex; justify-content: flex-start; align-items: center; gap: 0.6em; margin-bottom: 0.5em; }
      .collection-header h2 { flex: 1 1 auto; min-width: 0; }
      .collection-toggle { flex: 0 0 auto; }
      .collection-buttons { display: flex; gap: 0.4em; flex: 0 0 auto; margin-left: auto; align-items: center; }
      /* Up/Down arrow buttons that sit left of Refresh. Keep the
         vertical padding identical to the standard button rule above
         so heights line up with Refresh/Remove; only the horizontal
         padding is tightened so the arrow glyph isn't drowned in
         whitespace. */
      /* The "Local files" opt-out, sitting among the header's buttons.
         Labeled (unlike the bare enable switch on the left) because an
         unlabeled second switch up here would read as a second
         enable/disable control. */
      .local-files-toggle {
        display: flex;
        align-items: center;
        gap: 0.3em;
        font-size: 0.85em;
        color: #555;
        cursor: pointer;
        white-space: nowrap;
      }
      .move-collection { padding: 0.3em 0.5em; }
      .move-collection:disabled { cursor: not-allowed; opacity: 0.35; }
      .script-table { width: 100%; border-collapse: collapse; }
      .script-table th, .script-table td { text-align: left; padding: 0.3em 0.6em; border-bottom: 1px solid #eee; vertical-align: top; }
      .script-table th { font-weight: 600; color: #555; font-size: 0.9em; }
      .script-table tbody tr:last-child td { border-bottom: none; }
      .script-table td.size-cell, .script-table td.status-cell, .script-table td.toggle-cell, .script-table td.action-cell { white-space: nowrap; width: 1%; }
      /* Container-collection action column: the per-row remove button.
         Right-aligned so the trash icon hugs the table edge regardless
         of how narrow / wide the name column wants to be. */
      .script-table td.action-cell { text-align: right; padding-left: 0.2em; }
      .script-table th:last-child { width: 1%; }
      .script-table td.toggle-cell { padding-right: 0.2em; }
      /* When a collection is off, its whole section dims; when a script is off, just the row dims.
         The toggle itself stays at full opacity so users can flip it back. */
      .collection.disabled .collection-header h2,
      .script-table tr.disabled td:not(.toggle-cell) { opacity: 0.45; }
      .toggle { display: inline-flex; align-items: center; cursor: pointer; }
      .toggle input[type="checkbox"] { cursor: pointer; margin: 0; }
      .toggle-disabled { cursor: not-allowed; opacity: 0.5; }
      .toggle-disabled input[type="checkbox"] { cursor: not-allowed; }
      /* Bulk-toggle button in the script-table header. Sized like the
         per-row checkbox so the column lines up. */
      .bulk-toggle { width: 14px; height: 14px; padding: 0; font: inherit; font-weight: 700; line-height: 1; border: 1px solid #888; border-radius: 2px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
      .bulk-toggle:hover:not(:disabled) { background: #f0f0f0; }
      .bulk-toggle:disabled { cursor: not-allowed; opacity: 0.5; }
      .script-table th.toggle-cell { white-space: nowrap; width: 1%; padding-right: 0.2em; }
      /* Dupe-basename suffix (e.g. " #2") shown after the script's
         name link. Empty for unique basenames so the column stays
         clean. */
      /* `white-space: nowrap` keeps the suffix itself intact now that
         the name cell wraps — it may land on its own continuation
         line, but never splits into `#` + `2`. */
      .log-id-suffix { color: #555; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; white-space: nowrap; }
      .log-id-suffix:not(:empty)::before { content: ' '; }
      /* Fixed-width slot for the site favicon to the left of the
         name link. Always present so the name column has a
         stable left edge. Holds either a clickable <a class="site-icon-inner">
         (when the script's @match yields a usable origin) or an inert
         <span class="site-icon-inner">. Inside is a globe placeholder
         that gets swapped for the real favicon once it loads. */
      .site-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 0.4em;
        vertical-align: text-bottom;
        flex: 0 0 auto;
        /* text-indent inherits, and this is a block container: reset it
           so the name cell's negative hanging indent can't shift the
           icon if a future inner is ever inline rather than
           display:block. */
        text-indent: 0;
      }
      .site-icon-inner {
        display: block;
        width: 16px;
        height: 16px;
        color: #888;
      }
      a.site-icon-inner { text-decoration: none; }
      a.site-icon-inner:hover { color: #444; }
      .site-icon img { width: 16px; height: 16px; display: block; }
      .site-icon-globe { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      /* Script names come from the file/URL and can be arbitrarily long
         (web-installed scripts often carry a whole marketing title).
         Let them wrap rather than force the table wider than its
         `.collection` card, which pushed Size / Status outside the box.
         `<wbr>` markers after each `/` (appendWithSlashBreaks) give
         preferred break points before a mid-word break is needed.
         The hanging indent keeps continuation lines aligned with the
         first line's text instead of tucking under the favicon. */
      .script-table td.name-cell {
        overflow-wrap: anywhere;
        word-break: normal;
        padding-left: calc(0.6em + 16px + 0.4em);
        text-indent: calc(-16px - 0.4em);
      }
      .status-ok { color: #166534; }
      .status-invalid, .status-rejected, .status-missing, .status-error { color: #b00; }
      .status-warning, .status-outdated { color: #b67200; }
      .status-refresh-failed { color: #c2410c; }
      /* The Status cell content is a link to that script's Log tab.
         Keep the link looking like status text (not blue underlined). */
      .status-cell a { text-decoration: none; color: inherit; cursor: pointer; }
      .status-cell a:hover { text-decoration: underline; }
      /* Small trash-can button shown beside the Status label on missing
         rows, so users can clear out records for files that are gone
         for good (refresh won't re-add them). */
      .remove-script {
        margin-left: 0.4em;
        padding: 0 0.3em;
        font: inherit;
        line-height: 1;
        border: 1px solid #ddd;
        background: transparent;
        cursor: pointer;
        color: #888;
      }
      .remove-script:hover:not(:disabled) { background: #f5c2c7; color: #b00; }
      .remove-script:disabled { cursor: not-allowed; opacity: 0.5; }
      .empty { color: #666; font-style: italic; }
      .error { color: #b00; }
      /* The banner box itself is in styles.css (shared with the
         viewer). These are the collections-page-only parts: a roomier
         gap before the collection list, and the raw-API-error line the
         "Allow User Scripts" banner appends. */
      .banner { margin-bottom: 1em; }
      .banner .banner-detail { color: #92400e; font-size: 0.85em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-top: 0.5em; }
      /* Inline busy spinner for individual controls (toggles, add form). */
      @keyframes sm-spin { to { transform: rotate(360deg); } }
      .busy-spinner { display: inline-block; width: 12px; height: 12px; margin-left: 6px; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: sm-spin 0.7s linear infinite; vertical-align: middle; box-sizing: border-box; }
      /* Bulk-toggle button shows its spinner in place of the +/- glyph. */
      .bulk-toggle.busy { position: relative; color: transparent; }
      .bulk-toggle.busy::after { content: ''; position: absolute; left: 50%; top: 50%; margin: -5px 0 0 -5px; width: 10px; height: 10px; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: sm-spin 0.7s linear infinite; box-sizing: border-box; }
      /* While a collection is being removed, dim the whole section and block further clicks. */
      .collection.removing { opacity: 0.5; pointer-events: none; }
      /* Highlight rows that changed during a refresh. The color
         persists until the next refresh clears it, so the
         user can leave the page and come back without losing the
         what-changed signal. */
      .script-table tr.row-updated td { background: #cdebcf; }
      .script-table tr.row-failed  td { background: #f5c2c7; }
      /* Import dialog. Sized so the instruction list reads as prose
         rather than a wrapped column, and centered by the native
         <dialog> so it doesn't have to compete with the page's own
         max-width. */
      #import-dialog { max-width: 32em; border: 1px solid #ccc; border-radius: 8px; padding: 1.2em 1.4em; color: #222; }
      #import-dialog::backdrop { background: rgb(0 0 0 / 0.35); }
      #import-dialog h2 { margin: 0 0 0.6em; font-size: 1.1em; }
      #import-dialog code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
      .import-steps { margin: 0 0 1em; padding-left: 1.4em; line-height: 1.5; }
      .import-steps li { margin-bottom: 0.3em; }
      /* Per-script problems from a partly-readable backup. Sits on the
         page rather than in the dialog, since the import succeeded and
         the dialog is gone by the time these are shown. Amber, not red:
         red on this page means something did not happen. */
      .import-warnings { margin: 0 0 1em; padding: 0.5em 0.7em; border-radius: 4px; background: #fef3c7; color: #92400e; font-size: 0.9em; }
      .import-warnings ul { margin: 0.3em 0 0; padding-left: 1.2em; }
      .import-actions { display: flex; justify-content: flex-end; gap: 0.5em; margin-top: 1.2em; }

      /* Top-of-page action bar — sits above the add form. The Options
         button anchors the left edge; Refresh All anchors the right. */
      .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5em; }
      .top-actions .right-actions { display: flex; align-items: center; }
      .top-actions .busy-spinner { margin-left: 0.5em; }
    </style>
  </head>
  <body>
    <!-- Shared globe glyph: defined once, referenced by every row's icon
         slot via <use href="#sm-globe"> so the path data isn't inlined
         per row. Stroke/fill styling is on `.site-icon-globe` in CSS. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sm-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></symbol></svg>
    <h1>SourceMonkey</h1>

    <div id="banner-slot"></div>

    <div class="top-actions">
      <button id="open-options" type="button" title="Open the options page">Options</button>
      <div class="right-actions">
        <button id="refresh-all" type="button" title="Refresh every collection">Refresh All</button>
      </div>
    </div>

    <form id="add-form" class="add-form">
      <input id="add-path" type="text" placeholder="Absolute path or URL, to a .user.js file, a directory, or a script_manifest.json file" required autocomplete="off" spellcheck="false" />
      <button type="submit">Add</button>
      <button id="open-import" type="button" title="Import scripts from a Tampermonkey backup file">Import</button>
    </form>
    <p id="add-error" class="error" hidden></p>
    <!-- Import warnings live on the PAGE, not in the dialog: they are
         reported for an import that succeeded, so they have to outlive
         the dialog closing and sit beside the section that just
         appeared. -->
    <div id="import-warnings" class="import-warnings" hidden></div>

    <!-- Import dialog. Instructions first, because the work is in
         Tampermonkey: nothing on its Utilities page can be driven by a
         link, so the user has to click Export there and bring the file
         back. See docs/import-export-tampermonkey.md. -->
    <dialog id="import-dialog">
      <h2>Import from Tampermonkey</h2>
      <ol class="import-steps">
        <li>Open <a id="import-tm-link" href="#" target="_blank" rel="noopener noreferrer">Tampermonkey's Utilities page</a>.</li>
        <li>Under <strong>File</strong>, click <strong>Export</strong>. Your browser saves a <code>tampermonkey-backup-….txt</code> file.</li>
        <li>Choose that file here:</li>
      </ol>
      <input id="import-file" type="file" accept=".txt,.json,application/json,text/plain" />
      <p id="import-error" class="error" hidden></p>
      <div class="import-actions">
        <button id="import-cancel" type="button">Cancel</button>
        <button id="import-run" type="button" disabled>Import</button>
      </div>
    </dialog>

    <div id="collections"></div>

    <script src="collections.js" type="module"></script>
  </body>
</html>
