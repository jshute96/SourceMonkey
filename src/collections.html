<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SourceMonkey | Collections</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; color: #222; }
      h1 { margin-top: 0; margin-bottom: 19px; }
      /* Grid layout so a long display name that needs to wrap stays
         inside the right-hand column instead of dropping back to the
         row's left edge. Column 1 sizes to the bubble; column 2 takes
         the remaining space and is where the name wraps. */
      h2 {
        font-size: 1em;
        margin: 0;
        word-break: break-all;
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: 0.5em;
        align-items: baseline;
      }
      /* `.collection-type-bubble` + colored `.bubble-*` variants +
         `.collection-display-name` typography are in styles.css (the
         cross-page shared stylesheet). */
      button { font: inherit; padding: 4px 11px; cursor: pointer; }
      input[type="text"] { font: inherit; padding: 4px 7px; }
      .placeholder { color: #666; }
      .add-form { display: flex; gap: 0.5em; margin-bottom: 1em; align-items: center; }
      .add-form input[type="text"] { flex: 1 1 auto; }
      .collection { border: 1px solid #ddd; border-radius: 6px; padding: 11px 14px; margin-bottom: 11px; }
      .collection-header { display: flex; justify-content: flex-start; align-items: center; gap: 0.6em; margin-bottom: 7px; }
      .collection-header h2 { flex: 1 1 auto; min-width: 0; }
      .collection-toggle { flex: 0 0 auto; }
      .collection-buttons { display: flex; gap: 0.4em; flex: 0 0 auto; margin-left: auto; align-items: center; }
      /* Up/Down arrow buttons, at the left end of the header's button
         row. Keep the vertical padding identical to the standard button
         rule above so heights line up with the buttons beside them;
         only the horizontal padding is tightened so the arrow glyph
         isn't drowned in whitespace. */
      .move-collection { padding: 4px 7px; }
      .move-collection:disabled { cursor: not-allowed; opacity: 0.35; }
      /* Whole-px vertical metrics on this page, and `separate` borders rather
         than `collapse` (a collapsed border is split half into each adjacent
         cell, landing rows on half pixels) — see docs/architecture.md,
         "Extension-page styling". */
      .script-table { width: 100%; border-collapse: separate; border-spacing: 0; }
      .script-table th, .script-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
      .script-table th { font-weight: 600; color: #555; font-size: 0.9em; line-height: 16px; }
      .script-table tbody tr:last-child td { border-bottom-color: transparent; }
      .script-table td.size-cell, .script-table td.status-cell, .script-table td.toggle-cell, .script-table td.action-cell, .script-table td.scheme-cell { white-space: nowrap; width: 1%; }
      /* Container-collection action column: the per-row remove button.
         Right-aligned so the trash icon hugs the table edge regardless
         of how narrow / wide the name column wants to be. */
      .script-table td.action-cell { text-align: right; padding-left: 3px; }
      .script-table th:last-child { width: 1%; }
      .script-table td.toggle-cell { padding-right: 3px; }
      /* When a collection is off, its whole section dims; when a script is off, just the row dims.
         The toggle itself stays at full opacity so users can flip it back. */
      .collection.disabled .collection-header h2,
      .script-table tr.disabled td:not(.toggle-cell) { opacity: 0.45; }
      .toggle { display: inline-flex; align-items: center; cursor: pointer; position: relative; }
      .toggle input[type="checkbox"] { cursor: pointer; margin: 0; }
      .toggle-disabled { cursor: not-allowed; opacity: 0.5; }
      .toggle-disabled input[type="checkbox"] { cursor: not-allowed; }
      /* Bulk-toggle button in the script-table header. Sized like the
         per-row checkbox so the column lines up. */
      /* vertical-align keeps the button's place in the header line box
         independent of its text: baseline-aligned, an empty inline-flex
         button sits a fraction lower and resizes the header row, which
         shifts every collection below. */
      .bulk-toggle { vertical-align: middle; width: 14px; height: 14px; padding: 0; font: inherit; font-weight: 700; line-height: 1; border: 1px solid #888; border-radius: 2px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
      .bulk-toggle:hover:not(:disabled) { background: #f0f0f0; }
      .bulk-toggle:disabled { cursor: not-allowed; opacity: 0.5; }
      .script-table th.toggle-cell { white-space: nowrap; width: 1%; padding-right: 3px; }
      /* Dupe-basename suffix (e.g. " #2") shown after the script's
         name link. Empty for unique basenames so the column stays
         clean. */
      /* `white-space: nowrap` keeps the suffix itself intact now that
         the name cell wraps — it may land on its own continuation
         line, but never splits into `#` + `2`. */
      .log-id-suffix { color: #555; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; white-space: nowrap; }
      .log-id-suffix:not(:empty)::before { content: ' '; }
      /* Fixed-width slot for the site favicon to the left of the
         name link. Always present so the name column has a
         stable left edge. Holds either a clickable <a class="site-icon-inner">
         (when the script's @match yields a usable origin) or an inert
         <span class="site-icon-inner">. Inside is a globe placeholder
         that gets swapped for the real favicon once it loads. */
      .site-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 0.4em;
        vertical-align: text-bottom;
        flex: 0 0 auto;
        /* text-indent inherits, and this is a block container: reset it
           so the name cell's negative hanging indent can't shift the
           icon if a future inner is ever inline rather than
           display:block. */
        text-indent: 0;
      }
      .site-icon-inner {
        display: block;
        width: 16px;
        height: 16px;
        color: #888;
      }
      a.site-icon-inner { text-decoration: none; }
      a.site-icon-inner:hover { color: #444; }
      .site-icon img { width: 16px; height: 16px; display: block; }
      .site-icon-globe { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      /* Script names come from the file/URL and can be arbitrarily long
         (web-installed scripts often carry a whole marketing title).
         Let them wrap rather than force the table wider than its
         `.collection` card, which pushed Size / Status outside the box.
         `<wbr>` markers after each `/` (appendWithSlashBreaks) give
         preferred break points before a mid-word break is needed.
         The hanging indent keeps continuation lines aligned with the
         first line's text instead of tucking under the favicon. */
      .script-table td.name-cell {
        overflow-wrap: anywhere;
        word-break: normal;
        padding-left: calc(8px + 16px + 0.4em);
        text-indent: calc(-16px - 0.4em);
      }
      .status-ok { color: #166534; }
      .status-invalid, .status-rejected, .status-missing, .status-error { color: #b00; }
      .status-warning, .status-outdated { color: #b67200; }
      .status-refresh-failed { color: #c2410c; }
      /* The Status cell content is a link to that script's Log tab.
         Keep the link looking like status text (not blue underlined). */
      .status-cell a { text-decoration: none; color: inherit; cursor: pointer; }
      .status-cell a:hover { text-decoration: underline; }
      /* `.remove-script` itself is in styles.css: the viewer's
         "Local copy…" row carries the same button and must not drift
         into a different-looking control. Only the gap to the Status
         label it sits beside is this page's. */
      .remove-script { margin-left: 0.4em; }
      /* In the collection header the button sits in a row of text
         buttons, so it wears their chrome rather than the bare glyph the
         shared rule gives it beside a table row: the UA's own button box
         (which is also what gives it a pressed state), this page's
         padding, and a glyph as dark as the labels beside it. The row's
         own `gap` does the spacing, and `stretch` matches Edit and
         Refresh exactly. The shared red hover survives — that is what
         says this one is destructive. */
      .collection-buttons .remove-script {
        margin-left: 0;
        align-self: stretch;
        padding: 4px 8px;
        border: revert;
        background: revert;
        color: inherit;
      }
      /* A whole-pixel glyph, not the shared rule's `1.15em`: this page's
         vertical metrics are whole-px (see the top of this file), and an
         18.4px icon in the header would land every card below it on a
         different fractional offset. */
      .collection-buttons .remove-script .delete-icon { width: 16px; height: 16px; }
      .empty { color: #666; font-style: italic; }
      .error { color: #b00; }
      /* The banner box itself is in styles.css (shared with the
         viewer). These are the collections-page-only parts: a roomier
         gap before the collection list, and the raw-API-error line the
         "Allow User Scripts" banner appends. */
      .banner { margin-bottom: 1em; }
      .banner .banner-detail { color: #92400e; font-size: 0.85em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-top: 0.5em; }
      /* Inline busy spinner for individual controls (toggles, add form). */
      @keyframes sm-spin { to { transform: rotate(360deg); } }
      .busy-spinner { display: inline-block; width: 12px; height: 12px; margin-left: 6px; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: sm-spin 0.7s linear infinite; vertical-align: middle; box-sizing: border-box; }
      /* Bulk-toggle button shows its spinner in place of the +/- glyph. */
      .bulk-toggle.busy { position: relative; color: transparent; }
      .bulk-toggle.busy::after { content: ''; position: absolute; left: 50%; top: 50%; margin: -5px 0 0 -5px; width: 10px; height: 10px; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: sm-spin 0.7s linear infinite; box-sizing: border-box; }
      /* A toggle's spinner is overlaid on its own checkbox rather than
         appended beside it. The script table's toggle cell sizes to its
         content, so an in-flow spinner widened that column and shifted
         every row in the collection a few pixels right (and back) for as
         long as the write was in flight. */
      .toggle .busy-spinner { position: absolute; inset: 0; width: auto; height: auto; margin: 0; }
      .toggle:has(.busy-spinner) input[type="checkbox"] { opacity: 0.3; }
      /* While a collection is being removed, dim the whole section and block further clicks. */
      .collection.removing { opacity: 0.5; pointer-events: none; }
      /* Highlight rows that changed during a refresh. The color
         persists until the next refresh clears it, so the
         user can leave the page and come back without losing the
         what-changed signal. */
      .script-table tr.row-updated td { background: #cdebcf; }
      .script-table tr.row-failed  td { background: #f5c2c7; }
      /* Top-of-page action bar — sits above the add form. Both buttons
         sit at the right edge, with Refresh All rightmost: the same
         order the collection headers use. */
      .top-actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 0.5em;
        margin-bottom: 0.5em;
      }
    </style>
  </head>
  <body>
    <!--#include glyph-sprite-->
    <h1>SourceMonkey | Collections</h1>

    <div id="banner-slot"></div>

    <div class="top-actions">
      <button id="open-options" type="button" title="Open the options page">Options</button>
      <button id="refresh-all" type="button" title="Refresh every collection">Refresh All</button>
    </div>

    <form id="add-form" class="add-form">
      <input id="add-path" type="text" placeholder="A .user.js file, a directory, a script_manifest.json, or a name for a new collection" autocomplete="off" spellcheck="false" />
      <button type="submit">Add</button>
    </form>
    <p id="add-error" class="error" hidden></p>

    <div id="collections"></div>

    <script src="collections.js" type="module"></script>
  </body>
</html>
