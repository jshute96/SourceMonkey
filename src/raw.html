<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Replaced with the script's filename once the content loads;
         this is what the tab shows until then (and if it fails). -->
    <title>SourceMonkey | Raw source</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { margin: 0; color: #222; background: #fff; font: 14px system-ui, sans-serif; }
      /* Deliberately unstyled beyond monospace + preserved whitespace:
         this view exists to show the file exactly as fetched. */
      pre {
        margin: 0;
        /* 16px, matching the header bar's side padding. */
        padding: 16px;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
        tab-size: 4;
      }
      pre.notice { color: #666; font-style: italic; }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-inner">
        <a class="page-home page-icon-link" href="collections.html" target="_blank"
           rel="noopener" tabindex="-1" aria-hidden="true">
          <img class="page-icon" src="icons/icon-48.png" alt="" />
        </a>
        <!-- Deliberately empty: the filename lands a frame or two later
             (raw.ts), and a placeholder word here would be read as the
             page's name and then visibly replaced. Blank simply fills
             in. `Raw source` is still the fallback, but only once we
             know no filename is coming. -->
        <h1><a class="page-home brand" href="collections.html" target="_blank" rel="noopener"
             title="Open the collections page">SourceMonkey</a><span class="brand"> |</span> <span id="raw-title"></span></h1>
      </div>
    </header>
    <pre id="raw"></pre>
    <script src="raw.js" type="module"></script>
  </body>
</html>
