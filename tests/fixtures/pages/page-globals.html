<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>page globals</title>
    <script>
      // Page-realm state. Only a MAIN-world script can see these; from
      // the isolated USER_SCRIPT world they read as `undefined`. This
      // is what `unsafeWindow` is supposed to reach.
      window.__PAGE_APP__ = { name: 'page-app', calls: 0 };
      window.__PAGE_FN__ = function (arg) {
        window.__PAGE_APP__.calls += 1;
        return 'page-fn:' + arg;
      };
    </script>
  </head>
  <body>
    <main id="target">original content</main>
  </body>
</html>
