<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Embedded frame for the @noframes example</title>
  <link rel="stylesheet" href="../examples.css" />
</head>
<body>
  <header>
    <h1>Embedded frame</h1>
  </header>
  <main>
    <p class="hint">This document is loaded inside an
      <code>&lt;iframe&gt;</code> on the
      <code>@noframes</code> example page. Its URL matches the same
      patterns the parent does, so it is a candidate for injection in
      its own right.</p>

    <p id="runStatus" class="status">Waiting for userscripts&hellip;</p>

    <h2>Log (this frame)</h2>
    <ul id="log"></ul>
  </main>
</body>
</html>
